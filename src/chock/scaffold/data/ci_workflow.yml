# Auto-generated by chock sync --ci. Re-run to refresh; edits are overwritten.
name: chock

on:
  pull_request:

jobs:
  chock-gate:
    runs-on: ubuntu-latest
    # Scoped to this job: `security-events: write` is only for the SARIF upload at the end.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        # Full history: `--event ci` diffs base...head, which needs the base ref present.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From git, not PyPI: chock is not published yet, so emitting
      # `pip install chock` would have failed on the adopter's first CI run --
      # an installer whose output does not run is worse than no installer.
      # Swap this for `pip install chock` once the package is on PyPI.
      - name: Install chock
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/open-coder-ai/chock"

      - name: Validate artifacts
        run: chock check

      - name: Compiled artifacts match their manifests
        run: chock sync --repo . --check

      - name: Run compiled CI gates (commit-range mode)
        run: |
          shopt -s nullglob
          status=0
          for gate in .chock/compiled/*/ci-gate/gate.json; do
            id="$(basename "$(dirname "$(dirname "$gate")")")"
            echo "::group::chock ci-gate: $id"
            python3 .chock/bin/gate.py run --gate "$gate" --event ci \
              --base "origin/$GITHUB_BASE_REF" --head-ref "$GITHUB_HEAD_REF" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # The same gates' findings as SARIF, for code scanning. `always()` so a blocked run uploads
      # too; this step's exit code is the gate step's own, so it never decides the job alone.
      - name: Write SARIF findings
        id: sarif
        if: always()
        run: |
          chock check --event ci --format sarif --base "origin/$GITHUB_BASE_REF" \
            --head-ref "$GITHUB_HEAD_REF" --output "$RUNNER_TEMP/chock.sarif"

      # continue-on-error on this step only: code scanning may be off, or a fork's token read-only.
      - name: Upload SARIF to code scanning
        if: ${{ always() && steps.sarif.outcome != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/chock.sarif
          category: chock

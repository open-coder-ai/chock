# Auto-generated by chock sync --ci. Re-run to refresh; edits are overwritten.
name: chock

on:
  pull_request:

jobs:
  chock-gate:
    runs-on: ubuntu-latest
    # Scoped to this job: `security-events: write` is only for the SARIF upload at the end.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        # Full history: `--event ci` diffs base...head, which needs the base ref present.
        # No stored token: this job holds security-events: write and runs the pull request's code.
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # __ENGINE_PIN_NOTE__
      - name: Install chock
        run: |
          python -m pip install --upgrade pip
          python -m pip install "__ENGINE_SPEC__"

      - name: Validate artifacts
        run: chock check

      - name: Compiled artifacts match their manifests
        run: chock sync --repo . --check

      # A hook cannot guard its own config: refuse a pull request that disables or narrows a policy.
      # The base ref is a branch name, so it reaches the shell through env, as data. The checkout's
      # full history already holds origin/<base>; a base that does not resolve fails the step.
      - name: Policy set is no weaker than the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: chock check --only baseline --base "origin/$BASE_REF"

      - name: Run compiled CI gates (commit-range mode)
        run: |
          shopt -s nullglob
          status=0
          for gate in .chock/compiled/*/ci-gate/gate.json; do
            id="$(basename "$(dirname "$(dirname "$gate")")")"
            echo "::group::chock ci-gate: $id"
            python3 .chock/bin/gate.py run --gate "$gate" --event ci \
              --base "origin/$GITHUB_BASE_REF" --head-ref "$GITHUB_HEAD_REF" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # The same gates' findings as SARIF, for code scanning. `always()` so a blocked run uploads
      # too; this step's exit code is the gate step's own, so it never decides the job alone.
      - name: Write SARIF findings
        id: sarif
        if: always()
        run: |
          chock check --event ci --format sarif --base "origin/$GITHUB_BASE_REF" \
            --head-ref "$GITHUB_HEAD_REF" --output "$RUNNER_TEMP/chock.sarif"

      # continue-on-error on this step only: code scanning may be off, or a fork's token read-only.
      - name: Upload SARIF to code scanning
        if: ${{ always() && steps.sarif.outcome != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/chock.sarif
          category: chock

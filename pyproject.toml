[project]
name = "chock"
# Version contract (docs/compatibility.md): PATCH releases are emitter-byte-identical;
# MINOR releases may change compiled output. 0.1.0 is the first public release; the
# 0.0.1a0 pre-release exists only because PyPI names are claimed by uploading.
version = "0.7.0"
description = "Governance-as-code for AI coding agents: write a rule once, enforce it on git hooks, CI, and every agent"
readme = "README.md"
# PEP 639 SPDX expression; needs setuptools >= 77 (pinned in build-system below).
license = "Apache-2.0"
requires-python = ">=3.11"
# No email: SECURITY.md routes vulnerability reports through GitHub advisories, and a
# placeholder address would ship to PyPI as the project contact.
authors = [{ name = "Open Coder AI" }]
keywords = [
    "ai",
    "agents",
    "governance",
    "policy",
    "guardrails",
    "cli",
    "guardrails-for-coding-agents",
    "claude-code",
    "cursor",
    "github-copilot",
    "codex",
    "gemini-cli",
    "agents-md",
    "pretooluse",
    "agent-hooks",
    "git-hooks",
]
# No License classifier: deprecated alongside a PEP 639 license expression.
classifiers = [
    # Stays Alpha until the 1.0 line docs/compatibility.md promises: "chock is pre-1.0 --
    # the compatibility promise starts at 1.0". A stability claim here that the docs
    # contradict is the kind of thing this project does not ship.
    "Development Status :: 3 - Alpha",
    # `chock` is a console script (see [project.scripts]); there is no GUI or web surface.
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # No `Typing :: Typed`: the package ships no py.typed marker, so the claim would be
    # false to any type checker that went looking.
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18,<5",
    "referencing>=0.35,<0.38",
    # Build-time only: chock's plugin packaging consumes agentseam's per-agent layout
    # data (packaging.plan/supports/plugin_root/executable_ref) to render plugin bundles.
    # It never ships to an adopter repo -- the vendored PreToolUse/SessionStart runners
    # stay self-contained stdlib-only files, unaffected by this dependency. Pinned exact
    # per plan/spine-a/contract.md: the wave boundary is the published PyPI artifact.
    "agentseam==0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The tier 1 acceptance suite (acceptance/) is written in Gherkin.
    "pytest-bdd>=8.0",
    # Property-based tests (tests/test_properties.py) generate inputs for the parsers
    # whose outputs become shell tokens and paths.
    "hypothesis>=6.0",
    # Pin the minor: ruff's formatter changes behavior across minors (0.16 began
    # formatting Python inside Markdown), which silently breaks CI on unrelated PRs.
    "ruff>=0.16,<0.17",
    # Runs the DCO sign-off hook in .pre-commit-config.yaml.
    "pre-commit>=3.0",
]
build = [
    "build>=1.0",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/open-coder-ai/chock"
Repository = "https://github.com/open-coder-ai/chock"
Issues = "https://github.com/open-coder-ai/chock/issues"
Documentation = "https://github.com/open-coder-ai/chock/blob/main/docs/README.md"
Changelog = "https://github.com/open-coder-ai/chock/blob/main/CHANGELOG.md"

[project.scripts]
chock = "chock.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chock" = ["data/*.json"]
"chock.validation" = ["schemas/*.json", "frontier_standards/*.json"]
"chock.hooks" = ["data/*"]
# Emitter, scaffold and vendored-runtime templates (chock W48): non-Python artifact
# templates read at emit time via importlib.resources, never Python string literals.
"chock.compile.emitters" = ["data/*"]
"chock.scaffold" = ["data/*"]
"chock.gate" = ["data/*.tmpl"]
# `**/*` does NOT match dotfiles or dot-directories, so the chock-init
# template tree (.chock/, .agents/, .claude/, adapter dotfiles) was absent
# from every built wheel -- 42 files. The explicit dot-prefixed patterns below are
# required; verified by tests/test_wheel_install.py against a real wheel install.
"chock.packs" = ["**/*", "**/.*", "**/.*/**/*", "**/.*/**/.*"]
"chock.authoring" = ["data/*.json"]
# The per-package LICENSE text and icon `chock plugin build` emits into every published
# package, plus each store's owned-subtrees data `plugin/store.py` reads at emit time.
# Not `data/*.json` like the line above: these are a .txt and a .svg, and a json-only
# glob would ship neither -- the emitter would then work from a source checkout and
# raise FileNotFoundError from a `pip install`. Pinned by tests/test_wheel_install.py.
"chock.plugin" = ["data/*", "data/stores/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Markdown under docs/ and spec/ contains illustrative snippets
# (abbreviated bodies, placeholder tokens) that are documentation, not source.
# ruff >= 0.16 formats embedded Python in Markdown; exclude it so prose stays prose.
#
# .chock/bin/ is agentseam's bundler output (see gate/runtime_bundle.py): several
# independent source modules (contract, one per-vendor adapter, chock's own handler)
# composed source-level into one file. Composition can duplicate a module-level import
# two of those sources both happen to make (e.g. `import json as _json`) -- harmless at
# runtime, but not something either source module did wrong, so not a lint finding here.
extend-exclude = ["*.md", ".chock/bin/", "tests/fixtures/runtime_goldens/"]

[tool.ruff.lint]
# The Sonar/Checkstyle/FindBugs bar, in Python (plan/coding-standards.md §3, W50):
# C90 complexity, N naming, PLR/PLW/PLC pylint refactor/warning/convention, ERA
# commented-out code, T20 print-as-System.out, ARG unused args, RET/SIM/PIE
# FindBugs-class correctness, FBT boolean traps, A builtin shadowing, B bugbear,
# S bandit security, BLE blind except, TRY exception hygiene, RUF ruff-native.
select = [
    "E", "F", "W", "I",
    "C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE",
    "FBT", "A", "B", "S", "BLE", "TRY", "RUF",
]
# Layout is governed by `ruff format`; long diagnostic strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# tests/ and acceptance/ assert with bare `assert` by design (S101), commonly pass
# literal fixture values as positional args to helpers (FBT), and repeat short
# literal strings as test data, not magic values (PLR2004).
#
# TODO(lint-adoption): the rest of each list below is baseline debt this wave did not
# touch -- W50 scoped the fix to src/ (plan/spine-a/briefs/w50-chock-lint-adoption.md),
# and `ruff check .` lints the whole repo, so widening `select` in this file makes these
# out-of-scope trees newly fail unless deferred the same way. Enumerated by rule family
# (not per-finding: 400+ findings across ~90 files) in plan/spine-a/reports/w50.md
# (org-plan). A future wave should shrink these lists toward the tests/acceptance/**
# baseline above, not grow them.
"tests/**" = [
    "S101", "FBT", "PLR2004",
    "ARG001", "ARG002", "ARG004", "ARG005", "B905", "N806", "N814", "PLC0415",
    "PLR0402", "PLR0913", "PLR0917", "PLW1510", "RUF005", "RUF043", "RUF059", "S105",
    "S108", "S602", "S603", "S607", "SIM117", "SIM300", "T201", "TRY003",
]
"acceptance/**" = ["S101", "FBT", "PLR2004", "PLW1510", "S105", "S108", "S602", "S603"]
"fuzz/**" = ["S101"]
# docs/assets/gen_brand_assets.py derives docs/assets/social-preview.svg from repo data
# (see the ci.yml brand-assets job) -- a dev/build script, not shipped source.
"docs/assets/**" = ["ERA001", "PLR0913", "PLR0917", "PLR2004", "PLW2901", "RUF001", "RUF003", "RUF005", "S101", "S603", "T201"]
# A standalone CLI dev-tool script: printing its findings to stderr is the feature.
"tools/check_literal_duplication.py" = ["T201"]
# The installed copy of the packaged template below (chock install-skills); same
# print-is-the-feature reason.
".agents/skills/policy-init/assets/templates/scripts-stub.py" = ["T201"]
# Every import here is deliberately per-branch, not just at the top: tests/test_lifecycle.py
# and tests/test_remove.py inject fakes with monkeypatch.setattr("chock.<mod>.<name>", ...)
# against the *source* module, which only takes effect if the caller re-imports the name on
# each call rather than binding it once at module load. Both also print their own genuine
# CLI output (see the T201 note below), hence the combined rule list.
"src/chock/lifecycle.py" = ["PLC0415", "T201"]
"src/chock/scaffold/remove.py" = ["PLC0415", "T201"]
# Genuine CLI/render surfaces: every print() here is chock's own end-user output --
# argparse main()/*_main() status lines and tables, warnings the [WARN]/[ERROR] helpers in
# chock/output.py don't cover (wrong stream, compound messages), or a report renderer
# (validation/report.py, gatelog.py). chock has no other consumer of these strings, so
# routing each through an indirection layer would not change behaviour, only add churn.
"src/chock/cli.py" = ["T201"]
"src/chock/toggles.py" = ["T201", "C901"]
"src/chock/lock.py" = ["T201"]
"src/chock/gatelog.py" = ["T201"]
"src/chock/authoring/compliance.py" = ["T201"]
"src/chock/authoring/matrix.py" = ["T201"]
"src/chock/compile/compiler.py" = ["T201"]
"src/chock/eval/cli.py" = ["T201"]
"src/chock/gate/guard_runner.py" = ["T201", "PLR0911"]
"src/chock/gate/runner.py" = ["T201", "PLR0913", "PLR0917", "PLR0911"]
"src/chock/gateway/__main__.py" = ["T201"]
"src/chock/hooks/autocompile.py" = ["T201"]
"src/chock/hooks/install.py" = ["T201"]
"src/chock/hooks/installers.py" = ["T201"]
"src/chock/hooks/ownership.py" = ["T201"]
"src/chock/hooks/sessionstart_install.py" = ["T201"]
"src/chock/index/cli.py" = ["T201"]
"src/chock/plugin/cli.py" = ["T201", "C901", "PLR0911", "PLR0912", "PLR0915"]
"src/chock/plugin/marketplace.py" = ["T201"]
"src/chock/registry/cli.py" = ["T201"]
"src/chock/registry/core.py" = ["T201", "C901"]
"src/chock/review/cli.py" = ["T201"]
"src/chock/scaffold/add.py" = ["T201", "PLR0913"]
"src/chock/scaffold/init.py" = ["T201", "C901", "PLR0912", "PLR0915"]
"src/chock/scaffold/install_ci.py" = ["T201"]
"src/chock/scaffold/new.py" = ["T201"]
"src/chock/scaffold/recompile.py" = ["T201", "C901"]
"src/chock/scaffold/skills.py" = ["T201"]
"src/chock/scaffold/skills_bridge.py" = ["T201"]
"src/chock/validation/engine.py" = ["T201", "PLR0913"]
"src/chock/validation/frontier_ingest.py" = ["T201"]
"src/chock/validation/report.py" = ["T201"]
# Scaffolding template: `print` is the placeholder body of a `chock new` skill script
# stub, not chock's own CLI surface.
"src/chock/packs/_skills/policy-init/assets/templates/scripts-stub.py" = ["T201"]

# TODO(lint-adoption): baseline complexity/arg-count findings, W50. Each needs an actual
# function split or argument-bundling refactor to fix, which the brief marks as its own
# careful, behaviour-preservation-checked step -- deferred here rather than attempted
# under this same pass, and enumerated in plan/spine-a/reports/w50.md (org-plan) with the
# specific function per finding. Every entry above this block was fixed, not deferred.
"src/chock/eval/derive.py" = ["PLR0913", "PLR0917"]  # _case (6 args)
"src/chock/eval/execute.py" = ["PLR0911"]  # _run_guard (8 returns)
"src/chock/hooks/in_agent_install.py" = ["C901"]  # _install_merged, installed_policy_ids
"src/chock/manifest.py" = ["C901", "PLR0912", "PLR0915"]  # _project_skill_frontmatter
"src/chock/plugin/store.py" = ["PLR0913", "PLR0917"]  # 3 owned_subtrees-family builders (6 args each)
"src/chock/validation/checks_content.py" = ["C901"]  # check_token_budgets
"src/chock/validation/checks_determinism.py" = ["C901"]  # check_script_integrity
"src/chock/validation/checks_evals.py" = ["C901"]  # check_eval_first
"src/chock/validation/checks_orchestration.py" = ["C901", "PLR0912", "PLR0915"]  # check_dependencies_resolvable, check_composition_contract
"src/chock/validation/checks_security.py" = ["PLR0911"]  # _scan_text_surfaces (8 returns)
"src/chock/validation/frontier.py" = ["C901", "PLR0912"]  # check_frontier_mode
"src/chock/validation/loading.py" = ["C901", "PLR0912"]  # discover_artifacts

id: code-safety
name: "Code Safety Rule"
version: "0.0.1"
description: >
  trigger: secrets, eval/exec, unsanitized SQL, hallucinated dependencies.
  avoid: committing credentials, adding unverified packages, executing dynamic code.
artifact: rule
enforcement: advise
compliance:
  owasp_asi:
  - ASI05
rule:
  text: |
    never(commit): secrets|keys|tokens|passwords|.env; never(add): eval|exec|unsanitized_sql
    before(dependency): verify(exists_in_registry); on_find(secret|hallucinated_pkg): block + remove
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-07-12T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."

id: agent-discipline
name: "Agent Discipline Rule"
version: "0.0.2"
description: >
  trigger: edits without reading, unverified completion claims, weakened tests, dead code.
  avoid: skipping verification, deleting assertions, leaving unused code.
artifact: rule
enforcement: advise
rule:
  text: |
    before(edit): read(file); before(done): verify(flow) + tests_pass + lint_clean; on_find(dead_code|unused): delete
    never(fix_test_by): delete_assertion|weaken_check|skip; see(protect-test-integrity): deleted_test|assertion_loss|vacuous_assert; see(block-test-skips): added_skip|only
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-09-29T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-09-29'
  changes:
  - "Point the mechanised slice of never(fix_test_by) at its enforcing policies: protect-test-integrity (deleted test files, net assertion loss, vacuous assertions; commit gate) and block-test-skips (added skips and focus markers; commit and agent tool-use). This rule stays advisory and keeps the clause, since weakening a check in ways no pattern sees is still the agent's to avoid. Wording only."

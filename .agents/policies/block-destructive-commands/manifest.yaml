id: block-destructive-commands
name: "Block Destructive Commands"
version: "0.0.1"
description: >
  Best-effort guard against destructive commands: rm -rf targeting absolute, home, or
  root-adjacent paths; git push --force (not --force-with-lease); git reset --hard;
  git clean -f; kubectl delete; terraform destroy. Known bypass classes include aliases,
  quoted arguments, non-standard clients, and scripts that invoke these commands indirectly.
  This is friction, not a security boundary.
artifact: rule
enforcement: advise
compliance:
  owasp_asi:
  - ASI02
rule:
  text: |
    block(destructive_command): rm_-rf(/|~|.), git_push_--force, git_reset_--hard, git_checkout_., git_clean_-f, kubectl_delete, terraform_destroy
    require_approval: reset_hard|rm_-rf|branch_-D; prefer: stash|soft_reset|force-with-lease|dry-run
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-07-12T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."

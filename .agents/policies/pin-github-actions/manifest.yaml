id: pin-github-actions
name: "Pin GitHub Actions"
version: "0.0.4"
description: >
  The mechanizable slice of CI supply-chain hardening, enforced at two points: at commit (the
  git hook, over staged changes) and at agent tool-use (over a tool call's arguments, as the
  agent writes) -- a workflow that references a third-party GitHub Action by a movable ref -- a branch or a version tag -- instead
  of a full 40-character commit SHA. A tag like v4 or a branch like main can be re-pointed at new
  code after review, so the action that runs tomorrow need not be the one that was audited today;
  a compromised or rug-pulled release rides in on exactly that mutability. The gate blocks an
  added line that references an action by a non-SHA ref (owner/repo at a tag/branch); a full
  40-char SHA pin passes, local actions (no ref) pass, and 'pragma: allowlist unpinned-action'
  on the same line is a visible, deliberate exception. This is the OpenSSF Scorecard
  Pinned-Dependencies control for the slice a diff can show; signature and provenance verification
  stay out of scope.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false
applies_to:
  # Where a `uses:` line can reach a third-party action: workflows, and the composite actions
  # they call. Without this bound the gate judges every file it is shown -- at the turn's end
  # that is the whole worktree -- and refuses the README that documents how to pin an action.
  paths:
  - ".github/workflows/*"
  - ".github/actions/*"

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Unpinned GitHub Action detected: a workflow references an action by a tag or branch
      (owner/repo at a movable ref) rather than a full 40-character commit SHA. Pin it to the
      SHA -- keep the version in a trailing comment for readability -- so a re-tagged or
      compromised release cannot change what runs. 'pragma: allowlist unpinned-action' on the same line marks a reviewed exception; in the agent (tool use, the turn's end) it counts only when that exact line is already committed in HEAD, so an agent asks a person rather than writing the pragma itself.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+unpinned-action'
      # The single-character class [s] keeps this pattern from matching its own source text in
      # this manifest and in the compiled gate.json while matching identical real content, so
      # committing this policy folder does not trip the policy's own gate (#32). An optional
      # quote after the colon covers a quoted YAML value ("owner/repo@main"). The negative
      # lookahead exempts a full 40-hex commit SHA ONLY when it ends at a scalar boundary
      # (quote, whitespace, '#', or end of line) -- so a 40-hex PREFIX followed by more ref
      # characters (owner/repo@<40hex>-release) is still a movable ref and is blocked.
      content_pattern: |-
        use[s]:\s*["']?[A-Za-z0-9._/-]+@(?![0-9a-fA-F]{40}(?:["'\s#]|$))[A-Za-z0-9._/-]+

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "blocks the unpinned-action acquisition path a diff can show; signature/provenance verification and non-Actions supply chain remain out of scope"
  mitre_atlas:
  - control: AML.T0109
    coverage: partial
    note: "SHA pinning removes the floating-ref carrier of a re-tag / rug-pull on a third-party action"

provenance:
  author: "chock-core"
  created_at: "2026-08-26T00:00:00Z"
  updated_at: "2026-09-20T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-26'
  changes:
  - "Initial draft: content_regex gate over GitHub Action references pinned to a tag or branch instead of a full 40-char commit SHA. Self-safe pattern (single-char class, #32); 40-hex SHA and local (ref-less) actions pass; 'pragma: allowlist unpinned-action' escapes."
- version: 0.0.2
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so an unpinned action reference is caught as the agent writes the workflow, not only at commit. No pattern change. Message notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
- version: 0.0.3
  date: '2026-09-20'
  changes:
  - "Bound the gate to the files a `uses:` reference can live in (applies_to.paths: .github/workflows/*, .github/actions/*). The engine now runs this policy at the agent's write path and at the end of a turn, where the text under judgement is whatever was written -- unbounded, a README that documents how to pin an action was refused, and a control that fires on a correct change has failed. No pattern change; the commit-time behaviour on workflow files is unchanged. Evals tc-010 (a README quoting an unpinned action is allowed) and tc-011 (a composite action under .github/actions/ is blocked) prove the bound both ways."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, a commit made with CHOCK_AGENT_COMMIT set) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."

suite:
  id: pin-github-actions-tests-v1
  policy_id: pin-github-actions
  version_constraint: ">=0.0.1"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # The `# pragma: allowlist unpinned-action` trailers below are YAML comments, not part of the
  # scanned file content -- they keep committing THIS suite from tripping the catalog's own gate
  # on the example lines, while the gate under test still sees pragma-free content and blocks.
  cases:
  - id: tc-001
    category: trigger
    prompt: A staged workflow references an action by a major version tag.
    expect: The gate blocks the commit; a tag is a movable ref.
    execute:
      files:
        .github/workflows/ci.yml: "jobs:\n  build:\n    steps:\n      - uses: actions/checkout@v4\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-002
    category: negative_trigger
    prompt: A staged workflow pins the action to a full commit SHA.
    expect: The gate allows the commit; a 40-char SHA is an immutable pin.
    execute:
      files:
        .github/workflows/ci.yml: "jobs:\n  build:\n    steps:\n      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3\n"  # pragma: allowlist unpinned-action
      expect: allow
  - id: tc-003
    category: trigger
    prompt: A staged workflow references an action by a branch.
    expect: The gate blocks the commit; a branch can be re-pointed at new code.
    execute:
      files:
        .github/workflows/release.yml: "    steps:\n      - uses: some-org/deploy-action@main\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-004
    category: negative_trigger
    prompt: A staged workflow calls a local composite action with no ref.
    expect: The gate allows it; a local action carries no movable ref to pin.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: ./.github/actions/setup\n"
      expect: allow
  - id: tc-005
    category: behavior
    prompt: A staged workflow keeps a tag but marks it a deliberate exception on the line.
    expect: The gate allows it; the exception is visible in the diff.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: actions/checkout@v4  # pragma: allowlist unpinned-action\n"
      expect: allow
  - id: tc-006
    category: trigger
    prompt: A staged workflow references an action by a patch version tag.
    expect: The gate blocks the commit; even a specific tag is re-pointable.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: actions/cache@v4.1.1\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-007
    category: adversarial
    prompt: A staged workflow quotes the action reference to dodge a matcher anchored on the colon.
    expect: The gate blocks the commit; an optional quote after the colon is allowed for.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: \"some-org/action@main\"\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-008
    category: adversarial
    prompt: A staged workflow uses a ref that starts with 40 hex characters but continues as a tag.
    expect: The gate blocks the commit; a 40-hex prefix is not a full SHA pin.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: some-org/action@8f4b7f84864484a7bf31766abe9204da3cbe65b3-release\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-009
    category: negative_trigger
    prompt: A staged workflow pins to a full SHA inside quotes.
    expect: The gate allows a quoted 40-char SHA; the quote does not defeat the pin exemption.
    execute:
      files:
        .github/workflows/ci.yml: "    steps:\n      - uses: \"actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3\"\n"
      expect: allow
  - id: tc-010
    category: negative_trigger
    prompt: A staged README documents an unpinned action as the thing not to write.
    expect: The gate allows it; applies_to.paths bounds the gate to workflows and composite actions.
    execute:
      files:
        README.md: "Do not write:\n\n    - uses: actions/checkout@v4\n"  # pragma: allowlist unpinned-action
      expect: allow
  - id: tc-011
    category: trigger
    prompt: A staged composite action references a third-party action by a tag.
    expect: The gate blocks the commit; .github/actions/ is inside the bound.
    execute:
      files:
        .github/actions/setup/action.yml: "runs:\n  using: composite\n  steps:\n    - uses: actions/setup-python@v5\n"  # pragma: allowlist unpinned-action
      expect: block
  - id: tc-012
    category: trigger
    prompt: "The agent writes an action pinned to a movable tag into .github/workflows/ci.yml."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4\n"}, expect: block}  # pragma: allowlist unpinned-action
  - id: tc-013
    category: negative_trigger
    prompt: "The agent writes a clean .github/workflows/ci.yml."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3\n"}, expect: allow}  # pragma: allowlist unpinned-action
  - id: tc-014
    category: behavior
    prompt: ".github/workflows/ci.yml already holds a reviewed, waived line in HEAD; the agent edits elsewhere in the file."
    expect: "The write is allowed: a waiver already in HEAD is honoured in the agent."
    execute: {event: tool_use, head_files: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4  # pragma: allowlist unpinned-action\n"}, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4  # pragma: allowlist unpinned-action\n      - run: make test\n"}, expect: allow}  # pragma: allowlist unpinned-action
  - id: tc-015
    category: behavior
    prompt: "The agent adds the waiver pragma itself to a line that violates the gate in .github/workflows/ci.yml."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {event: tool_use, head_files: {".github/workflows/ci.yml": "      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3\n"}, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4  # pragma: allowlist unpinned-action\n"}, expect: block}  # pragma: allowlist unpinned-action
  - id: tc-016
    category: trigger
    prompt: "At the turn's end .github/workflows/ci.yml on disk holds an action pinned to a movable tag that HEAD lacks."
    expect: "The turn is blocked: the diff against HEAD adds it."
    execute: {event: stop, head_files: {".github/workflows/ci.yml": "      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3\n"}, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4\n"}, expect: block}  # pragma: allowlist unpinned-action
  - id: tc-017
    category: negative_trigger
    prompt: "At the turn's end .github/workflows/ci.yml differs from HEAD only by a clean line; HEAD already holds an old violation."
    expect: "The turn is allowed: only the lines the turn added are judged."
    execute: {event: stop, head_files: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4\n"}, writes: {".github/workflows/ci.yml": "      - uses: actions/checkout@v4\n      - run: make test\n"}, expect: allow}  # pragma: allowlist unpinned-action

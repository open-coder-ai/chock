id: memory-discipline
name: "Memory Discipline Rule"
version: "0.0.4"
description: >
  trigger: repeated mistakes, rediscovered patterns, preferences, non-derivable facts.
  avoid: persisting file contents, git history, or task intermediates as memory.
artifact: rule
enforcement: advise
rule:
  text: |
    persist: decisions|preferences|non_derivable_facts; never_persist: file_contents|git_history|task_intermediates; see(guard-memory-writes): pasted_git_history|code_block>20_lines|duplicate_line|secret, enforced at commit and agent write
    extract(atomic_facts); consolidate(near_duplicate_facts); decay(stale); verify(memory) before_recommend
compliance:
  mitre_atlas:
  - control: AML.T0080
    coverage: partial
    note: "advisory hygiene for what may enter durable agent memory"

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-09-29T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-25'
  changes:
  - "Honesty (do-not-claim): drop the false-precision constant from the rule text -- consolidate(similar > 0.85) implied a similarity engine that does not exist; now consolidate(near_duplicate_facts). Wording only."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Point the mechanisable slice of never_persist at guard-memory-writes, which refuses pasted git history, oversized fenced code blocks, duplicate lines and secrets in memory files. The rule stays advisory: whether a fact is non-derivable or a file's contents were summarised is not decidable by pattern. Wording only."

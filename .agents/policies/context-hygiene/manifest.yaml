id: context-hygiene
name: "Context Hygiene Rule"
version: "0.0.1"
description: >
  trigger: context bloat, stale observations, resolved content inlined, noisy exploration.
  avoid: context rot and lost-in-the-middle failures.
artifact: rule
enforcement: advise
rule:
  text: |
    replace(resolved_content): path_ref_only; delegate(noisy_exploration): subagent; prune(stale > 3_turns)
    on_context_growth: summarize(old_observations); keep(decisions+outcomes); discard(superseded_content)
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-07-12T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."

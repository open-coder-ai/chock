id: protect-commit-privacy
name: "Protect Commit Privacy"
version: "0.2.0"
description: >
  Keep the development conversation out of git history. Agent-authored commits narrate by
  default -- who asked for what, which discussion decided it, what the plan was -- and on a
  public repo that narration is published forever. The guard refuses git commit commands
  whose message (inline -m/--message or the file behind -F/--file) contains process-leak
  markers; the rule tells the agent to describe the change, not the conversation, and to
  propose sensitive messages to the human before committing. The command line is parsed, so a
  commit or gh pr create|edit behind cd, sh -c/bash -c, sudo, env or command is read like a bare one,
  a message fed on `-F -` from a heredoc is scanned, and a command that merely echoes the pattern
  as documentation still passes. A commit-msg hook applies the same markers to the message git
  records. Best-effort: markers are a
  narrow deny-list, and a message the human explicitly approves can say anything -- edit
  the marker list in the guard, the content is yours.
artifact: rule
enforcement: advise
rule:
  text: |
    commit_message|pr_description: describe(change); never(narrate: conversation|plan|who_asked|user_quotes|session_refs|internal_doc_paths)
    if(sensitive_context): propose_message_to_human; await(approval) before(commit)  # history is published forever
hook:
  script:
    "on": [commit-msg]
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-09-29T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Second check at the git commit-msg hook: hook.script on [commit-msg] with implementations/protect-commit-privacy-commit-msg.py (stdlib). git passes the message file as argv[1]; the script drops git's comment lines (those starting with '#') and anything below a `commit --verbose` scissors line, then applies the guard's own MARKERS (imported from the file beside it, one list) case-insensitively. A hit prints the marker and exits 1, which aborts the commit; an unreadable message or a missing argument exits 2, never 0. This judges the message git records, not the command line, so a message written by an editor, a script or an API client is checked too. The policy carried no hook before, so hook.script is free. Guard unchanged; chock's eval replay cannot drive an event script, so the cases are pytest with temporary git repositories."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/protect-commit-privacy.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `cd x && git commit -m '...marker...'` and the same behind sudo, env and pwsh -Command; a message or PR body fed by heredoc on `-F -` / `--body-file -`; a `$(cat <<'EOF' ...)` message. The old raw-text fallback for shell wrappers is gone: the wrapped command is parsed and judged as the command it is, so `git log --grep 'the user asked'` and `echo git commit -m ...` remain allowed. The marker list is unchanged."
- version: 0.0.5
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: the leading VAR=value
    wrapper-prefix skip (a clean `GIT_AUTHOR_NAME=bot git commit`, allowed), the attached
    `--body=VALUE` form and the combined `-bVALUE` short-flag form on `gh pr create`, both
    narrating text and refused. The file-reading forms (`--file=`, `--body-file=`, `-FVALUE`)
    need a readable file, which an eval case cannot provide (chock replays in a fresh, empty
    repo) -- a direct-invocation test (test_guard_direct.py) covers those instead, both
    blocking a narrating file and allowing a clean one. Guard unchanged."
- version: 0.0.4
  date: '2026-09-21'
  changes:
  - "Bypass fix (deep review): the guard keys on argv[0] to tell a real git/gh invocation
    from one merely printed (echo git commit ...), but shlex collapses a sh -c/bash -c
    payload into one opaque argv token before this guard ever sees it, so argv[0] becomes
    sh/bash and the message never reaches the positional scan at all -- a commit or PR
    composed this way carried no marker check whatsoever. Added a raw-text fallback scoped
    to argv[0] actually being a shell interpreter (sh/bash/zsh/ksh/dash), so the echo case
    that keying on argv[0] exists to allow stays allowed -- caught as a regression in
    self-testing before it shipped, together with an unrelated bug (the fallback read the
    MARKERS array before it was defined, a silent no-op under set -u) found the same way.
    Three eval cases added (tc-021..tc-023)."
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release, authored from a live incident: this catalog's own maintainer found agent-written commit messages narrating private decisions that were headed for a public repo."
- version: 0.0.2
  date: '2026-08-22'
  changes:
  - "Delivery bump for the Claude-format plugin packages built from this policy: on republish, their PreToolUse command is a single python3 invocation (the proposed interpreter-fallback chain was rejected after review proved it could erase deny verdicts) and their descriptions state the per-client fail posture. Guard logic and this repo's own artifacts are unchanged."
- version: 0.0.3
  date: '2026-08-24'
  changes:
  - "PR-body coverage + session-link marker (hardening review, from a live incident: agent harnesses appended claude.ai/code/session URLs to public PR bodies). The rule already claimed pr_description and session_refs; the guard now delivers the CLI slice: it also scans `gh pr create|edit` bodies (--body/-b, --body-file, -F, and attached forms) and adds `claude.ai/code/session` to the marker list. Combined short clusters carrying -m/-b (`git commit -am`, `-sam`, `-amMSG`) are now scanned -- previously the message escaped the parser. Target detection keys on the command after skipping transparent prefixes (sudo, command, env VAR=val, nice ...) so `command git commit` is caught while a non-command like `echo git commit -m ...` is not blocked; file reads use `cat --` to avoid option injection from a `-`-prefixed path. Thirteen eval cases added. A PR body set via the web UI or appended by a harness after the tool call remains out of reach and is the CI backstop's job."

id: verify-framework-conformance
name: "Verify Framework Conformance"
version: "0.0.1"
description: >
  Repo-local policy (this repo only, never published): run the fast deterministic
  conformance checks at commit time so an agent's mistake fails in seconds under its
  own hands instead of minutes later in CI. Lint, the docs-accuracy suite, and the
  emitter-stability goldens all caught real errors from CI on 2026-08-16; each is
  cheap enough to be a commit gate. CI remains the authority -- it re-runs everything
  on the pinned toolchain -- and this hook skips with a warning when the dev tools are
  absent, because the backstop exists precisely so the approximation may fail open.
artifact: rule
enforcement: advise
rule:
  text: |
    before(commit): pass(ruff, docs_accuracy_tests, emitter_stability_goldens)  # enforced by the installed pre-commit implementation
    if(check_fails): fix_the_source; never(edit_the_check_to_pass)
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-08-16T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial repo-local policy: commit-time mirror of the cheap CI conformance checks."

suite:
  id: block-wildcard-agent-permissions-tests-v1
  policy_id: block-wildcard-agent-permissions
  version_constraint: ">=0.0.1"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Hot payload lines carry the runtime pragma as a YAML comment so committing this
  # suite to a repo that runs the gate stays possible (#32 pattern); inside the
  # throwaway eval repo the staged file has no pragma and blocks as declared.
  cases:
  - id: tc-001
    category: trigger
    prompt: A staged Claude settings file allows every tool.
    expect: The hook blocks the commit.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"*\"]}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-002
    category: trigger
    prompt: A staged settings file grants unrestricted shell via a bare wildcard.
    expect: The hook blocks the commit.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"Bash(*)\"]}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-003
    category: trigger
    prompt: A staged MCP client config always-allows every tool of a server.
    expect: The hook blocks the commit.
    execute:
      files:
        mcp.json: "{\"mcpServers\": {\"s\": {\"alwaysAllow\": [\"*\"]}}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-004
    category: negative_trigger
    prompt: A staged settings file grants a scoped shell command.
    expect: The hook allows the commit.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"Bash(git status:*)\"]}}\n"
      expect: allow
  - id: tc-005
    category: negative_trigger
    prompt: A staged settings file names specific tools.
    expect: The hook allows the commit.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"Read\", \"Grep\"]}}\n"
      expect: allow
  - id: tc-006
    category: negative_trigger
    prompt: A staged file mentions a glob star outside a permission grant.
    expect: The hook allows the commit; a wildcard alone is not a grant.
    execute:
      files:
        build.md: "Run pytest tests/* before pushing.\n"
      expect: allow
  - id: tc-007
    category: behavior
    prompt: A reviewed exception carries the pragma on the same line as the grant.
    expect: The hook allows the commit; the escape is visible in the diff.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"Bash(*)\"]}}  // pragma: allowlist broad-agency\n"  # pragma: allowlist broad-agency
      expect: allow
  - id: tc-008
    category: adversarial
    prompt: A staged settings file lists the wildcard as a later array element, not the first.
    expect: The hook blocks; the wildcard need not be the first element.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"allow\": [\"Read\", \"*\"]}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-009
    category: adversarial
    prompt: A staged settings file turns on the whole-session bypass mode.
    expect: The hook blocks defaultMode bypassPermissions.
    execute:
      files:
        .claude/settings.json: "{\"permissions\": {\"defaultMode\": \"bypassPermissions\"}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-010
    category: adversarial
    prompt: A staged MCP config lists the wildcard among a server's tools array.
    expect: The hook blocks a wildcard in a tools array.
    execute:
      files:
        mcp.json: "{\"mcpServers\": {\"s\": {\"tools\": [\"read\", \"*\"]}}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-011
    category: adversarial
    prompt: A staged MCP config always-allows a later wildcard element.
    expect: The hook blocks a wildcard that is not the first alwaysAllow element.
    execute:
      files:
        mcp.json: "{\"mcpServers\": {\"s\": {\"alwaysAllow\": [\"list\", \"*\"]}}}\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-012
    category: adversarial
    prompt: A staged YAML-style agent config grants everything with an unquoted key.
    expect: The hook blocks; a YAML config need not quote its keys the way JSON does.
    execute:
      files:
        agent.yaml: "allow: [\"*\"]\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-013
    category: adversarial
    prompt: A staged YAML-style agent config grants everything with a single-quoted wildcard element.
    expect: The hook blocks a single-quoted wildcard just as it blocks a double-quoted one.
    execute:
      files:
        agent.yaml: "allow: ['*']\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-014
    category: adversarial
    prompt: A staged YAML-style agent config wildcards its tools list with an unquoted key.
    expect: The hook blocks an unquoted tools key the same way it blocks the quoted JSON form.
    execute:
      files:
        agent.yaml: "tools: [\"*\"]\n"  # pragma: allowlist broad-agency
      expect: block
  - id: tc-015
    category: negative_trigger
    prompt: A staged settings file has an unrelated key that merely contains "allow" as a substring.
    expect: The hook allows it; "disallow" and "allowlist" must not be mistaken for the "allow" key.
    execute:
      files:
        agent.yaml: "disallow: [\"*\"]\nallowlist: [\"*\"]\n"
      expect: allow
  - id: tc-016
    category: negative_trigger
    prompt: A staged YAML-style config scopes its grant with an unquoted key.
    expect: The hook allows a scoped grant regardless of whether the key is quoted.
    execute:
      files:
        agent.yaml: "allow: [\"Bash(git status:*)\"]\n"
      expect: allow
  - id: tc-017
    category: negative_trigger
    prompt: "The agent writes a clean agent-permissions.json."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {"agent-permissions.json": "{\"allow\": [\"Bash(git status)\"]}\n"}, expect: allow}  # pragma: allowlist broad-agency

id: git-safety
name: "Git Safety Rule"
version: "0.0.1"
description: >
  trigger: force push, hard reset, destructive branch delete, hook bypass, direct main commits.
  avoid: rewriting remote history, discarding uncommitted work, skipping pre-commit checks.
artifact: rule
enforcement: advise
rule:
  text: |
    never(without_approval): force_push|reset_hard|branch_-D|rm_-rf; never: --no-verify|skip_hooks
    before(commit): feature_branch(not main|master); prefer: atomic_commits; ask_if(diff > 500_lines)
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-07-12T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."

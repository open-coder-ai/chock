name: Bench hooks

# Times the real Claude Code hook commands (Bash and Write) for chock 1.0.0 from PyPI and for this
# checkout, in one job. CI is not an agent shell, so `chock init` runs here. Timing never gates a
# change: the job fails only when the harness itself errors. Windows and macOS run on demand
# (they bill 2x and 10x).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to measure"
        type: string
        default: main
      os:
        description: "Runner"
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
  pull_request:
    paths:
      - "src/chock/hooks/**"
      - "src/chock/gate/**"
      - "src/chock/compile/emitters/**"
      - "tools/bench_hooks*"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Time the hooks for both engines
        run: python tools/bench_hooks.py --engine 1.0.0 --engine . --markdown bench-summary.md > bench-hooks.json

      - name: Print the medians to the job summary
        run: |
          cat bench-summary.md
          {
            echo "## Hook latency (ms)"
            cat bench-summary.md
            echo
            echo '```json'
            cat bench-hooks.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-hooks-${{ github.event.inputs.os || 'ubuntu-latest' }}
          path: |
            bench-hooks.json
            bench-summary.md

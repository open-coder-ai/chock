# OSSF Scorecard: supply-chain posture score + public badge.
#
# Plumbing committed pre-launch, activation automatic at launch: the job is gated on
# the PUBLIC repository name, so it no-ops in the private workshop repo (which has a
# different name) and starts scoring on the first scheduled run after the public
# `open-coder-ai/chock` repo exists. publish_results feeds the REST API behind the
# README badge and requires a public repo -- another reason for the gate.
name: Scorecard

on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.repository == 'open-coder-ai/chock'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: results.sarif

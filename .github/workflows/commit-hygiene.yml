name: Commit hygiene

# A separate workflow, not a job appended to ci.yml: ci.yml sits exactly at the repo's own
# 300-line review-budget (tests/test_repo_standards.py::test_no_file_exceeds_line_budget),
# whose own failure message says to split by activity rather than grow the file further --
# the same reason figures.yml is its own file.
on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  no-private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commit messages for local or personal data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|session_[0-9A-Za-z]{12,}|claude\.ai/code/session|/tmp/claude-[0-9]|@(gmail|yahoo|hotmail|outlook|protonmail)\.'
          found=0
          while read -r sha; do
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              # Name the commit, never echo the match: a log line is a publication too.
              echo "::error::commit $sha contains local or personal data in its message"
              found=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..HEAD")
          exit "$found"

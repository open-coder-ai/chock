name: CodeQL

# Static analysis of the framework's own Python. A project that ships guardrails should be
# able to say what it runs against itself, and "nothing" is a poor answer.
#
# CodeQL needs the repository to be public, or GitHub Advanced Security on a private one. The
# job below is guarded on `private == false` rather than left to fail, because a workflow that
# is red on every push teaches everyone to ignore red workflows -- which is the same failure
# mode as a guard that cannot be satisfied. It starts working by itself the day the repo flips.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-hours on a Monday. The value of a scheduled run is catching advisories
    # published after the last commit, which is a weekly-scale event, not a per-push one.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: python
          # security-and-quality over the default: the default suite is tuned to keep noise
          # low on large codebases. This one is small, solo-reviewed, and its whole claim is
          # carefulness, so the broader suite is affordable and appropriate.
          queries: security-and-quality
          # .chock/bin/ is agentseam bundler output, excluded here for the same reason
          # pyproject.toml's ruff `extend-exclude` already excludes it -- see
          # .github/codeql/codeql-config.yml for the shared rationale.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:python"

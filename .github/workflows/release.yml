name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history and every branch, so the ancestry check below can see origin/main.
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unless the tag is v<version> and the commit is on main
        # pyproject.toml is the single source of chock.__version__ (importlib.metadata).
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v$version (pyproject.toml)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --require-hashes -r requirements/build.txt
      - name: Point README images at raw URLs
        # README.md is the PyPI long_description; PyPI cannot resolve repo-relative
        # image paths, so the published page would open on a broken-image placeholder.
        # Rewritten only in the build workspace -- the committed README keeps relative
        # paths, which are what GitHub renders best.
        #
        # REPO/REF go through env, never interpolated into the script: a git tag may
        # legally contain a single quote, and `${{ github.ref_name }}` spliced into a
        # quoted sed program would let a crafted tag run arbitrary bash in this job --
        # which holds id-token: write for Trusted Publishing.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          sed -i -E "s#<img src=\"docs/assets/#<img src=\"https://raw.githubusercontent.com/${REPO}/${REF}/docs/assets/#g" README.md
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: Refuse unless dist holds exactly this version's sdist and wheel
        run: |
          version=${GITHUB_REF_NAME#v}
          shopt -s nullglob dotglob
          files=(dist/*)
          if [ "${#files[@]}" -ne 2 ] || [ ! -f "dist/chock-${version}-py3-none-any.whl" ] \
            || [ ! -f "dist/chock-${version}.tar.gz" ]; then
            echo "::error::dist/ must hold exactly chock-${version}-py3-none-any.whl and chock-${version}.tar.gz, holds: ${files[*]}"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/

  binaries:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/binary.txt && pip install -e . --no-deps --no-build-isolation
      - name: Build one-file binary
        run: pyinstaller packaging/chock.spec
      - name: Rename binary with OS
        run: |
          if [ -f dist/chock.exe ]; then
            mv dist/chock.exe "dist/chock-${{ matrix.os }}.exe"
          else
            mv dist/chock "dist/chock-${{ matrix.os }}"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: chock-${{ matrix.os }}
          path: dist/chock-${{ matrix.os }}*

  release:
    needs: [pypi, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/
          pattern: chock-*
          # Without this, each artifact extracts into dist/chock-<os>/ and the
          # dist/chock* release glob matches directories instead of files.
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          find . -type f -name 'chock*' -exec sha256sum {} \; > checksums.txt
      - name: Extract release notes
        run: |
          awk '/^## /{if (p) exit; p=1; print; next} p{print}' CHANGELOG.md > release_notes.md
      - name: Attach release assets
        # The runner's own gh CLI, not a third-party action: one less external party in
        # the job that publishes releases, flagged by zizmor's superfluous-actions audit.
        #
        # The tag-triggered release almost always already exists by the time this runs:
        # the owner creates it via the GitHub UI (which creates the tag and the published
        # release together), and that push is what triggers this workflow. `gh release
        # create` errors on an existing release, which previously left the binaries and
        # checksums unattached even though PyPI publish had already succeeded (chock
        # v0.8.0's release still shows zero assets). Upload to whatever release already
        # exists; only fall back to creating one when none does, so a tag pushed without
        # a pre-existing release (e.g. directly via git) still gets one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/chock* dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              dist/chock* dist/checksums.txt
          fi

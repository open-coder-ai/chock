name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Verify tag matches pyproject version
        run: |
          pyproject_version=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version"
            exit 1
          fi

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --require-hashes -r requirements/build.txt
      - name: Point README images at raw URLs
        # README.md is the PyPI long_description; PyPI cannot resolve repo-relative
        # image paths, so the published page would open on a broken-image placeholder.
        # Rewritten only in the build workspace -- the committed README keeps relative
        # paths, which are what GitHub renders best.
        #
        # REPO/REF go through env, never interpolated into the script: a git tag may
        # legally contain a single quote, and `${{ github.ref_name }}` spliced into a
        # quoted sed program would let a crafted tag run arbitrary bash in this job --
        # which holds id-token: write for Trusted Publishing.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          sed -i -E "s#<img src=\"docs/assets/#<img src=\"https://raw.githubusercontent.com/${REPO}/${REF}/docs/assets/#g" README.md
      - name: Build sdist and wheel
        run: python -m build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/

  binaries:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[build]'
      - name: Build one-file binary
        run: pyinstaller packaging/chock.spec
      - name: Rename binary with OS
        run: |
          if [ -f dist/chock.exe ]; then
            mv dist/chock.exe "dist/chock-${{ matrix.os }}.exe"
          else
            mv dist/chock "dist/chock-${{ matrix.os }}"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: chock-${{ matrix.os }}
          path: dist/chock-${{ matrix.os }}*

  release:
    needs: [pypi, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist/
          pattern: chock-*
      - name: Compute checksums
        run: |
          cd dist
          find . -type f -name 'chock*' -exec sha256sum {} \; > checksums.txt
      - name: Extract release notes
        run: |
          awk '/^## /{if (p) exit; p=1; print; next} p{print}' CHANGELOG.md > release_notes.md
      - name: Create GitHub Release
        # The runner's own gh CLI, not a third-party action: one less external party in
        # the job that publishes releases, flagged by zizmor's superfluous-actions audit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --title "$GITHUB_REF_NAME"             --notes-file release_notes.md             dist/chock* dist/checksums.txt

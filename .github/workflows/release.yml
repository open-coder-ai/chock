name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject version
        run: |
          pyproject_version=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version"
            exit 1
          fi

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Point README images at raw URLs
        # README.md is the PyPI long_description; PyPI cannot resolve repo-relative
        # image paths, so the published page would open on a broken-image placeholder.
        # Rewritten only in the build workspace -- the committed README keeps relative
        # paths, which are what GitHub renders best.
        #
        # REPO/REF go through env, never interpolated into the script: a git tag may
        # legally contain a single quote, and `${{ github.ref_name }}` spliced into a
        # quoted sed program would let a crafted tag run arbitrary bash in this job --
        # which holds id-token: write for Trusted Publishing.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          sed -i -E "s#<img src=\"docs/assets/#<img src=\"https://raw.githubusercontent.com/${REPO}/${REF}/docs/assets/#g" README.md
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  binaries:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[build]'
      - name: Build one-file binary
        run: pyinstaller packaging/chock.spec
      - name: Rename binary with OS
        run: |
          if [ -f dist/chock.exe ]; then
            mv dist/chock.exe "dist/chock-${{ matrix.os }}.exe"
          else
            mv dist/chock "dist/chock-${{ matrix.os }}"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: chock-${{ matrix.os }}
          path: dist/chock-${{ matrix.os }}*

  release:
    needs: [pypi, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: chock-*
      - name: Compute checksums
        run: |
          cd dist
          find . -type f -name 'chock*' -exec sha256sum {} \; > checksums.txt
      - name: Extract release notes
        run: |
          awk '/^## /{if (p) exit; p=1; print; next} p{print}' CHANGELOG.md > release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/**/chock*
            dist/checksums.txt

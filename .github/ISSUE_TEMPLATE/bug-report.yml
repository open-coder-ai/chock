name: Bug report
description: A tool, check, or artifact misbehaves, including `chock install`, a plugin not loading, or an agent's hooks
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a policy that misfires, use the [chock-catalog forms](https://github.com/open-coder-ai/chock-catalog/issues/new/choose).
        For a vulnerability, do not open a public issue: use the private security advisory link in the issue chooser.
  - type: input
    id: surface
    attributes:
      label: Affected surface
      description: Tool path, artifact id, or invariant ID (e.g. `EXE-2`).
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The agent involved, if any.
      options:
        - claude-code
        - cursor
        - codex
        - copilot
        - devin
        - other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Command and minimal input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Paste the output verbatim.
    validations:
      required: true
  - type: input
    id: chock-version
    attributes:
      label: chock version
      description: Output of `chock --version`.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python3 --version`.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS 15.1, Ubuntu 24.04, Windows 11.
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here if it helps. Check it shows nothing you would not post publicly.
    validations:
      required: false

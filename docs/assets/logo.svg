<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chock logo: a wheel held by a chock wedge">
  <!-- Brand: navy #0D1626, gold #D9B45C — matches docs/assets/social-preview.png -->
  <rect width="512" height="512" rx="104" fill="#0D1626"/>
  <g stroke="#D9B45C" fill="none" stroke-width="14">
    <!-- wheel -->
    <circle cx="225" cy="258" r="92"/>
    <!-- spokes -->
    <g stroke-width="11">
      <line x1="225" y1="258" x2="225" y2="178"/>
      <line x1="225" y1="258" x2="294" y2="218"/>
      <line x1="225" y1="258" x2="294" y2="298"/>
      <line x1="225" y1="258" x2="225" y2="338"/>
      <line x1="225" y1="258" x2="156" y2="298"/>
      <line x1="225" y1="258" x2="156" y2="218"/>
    </g>
  </g>
  <!-- hub -->
  <circle cx="225" cy="258" r="24" fill="#D9B45C"/>
  <!-- the chock, set against the wheel -->
  <path d="M 318 352 L 416 352 L 416 262 Z" fill="#D9B45C"/>
  <!-- ground -->
  <line x1="96" y1="352" x2="416" y2="352" stroke="#D9B45C" stroke-width="12" stroke-linecap="round"/>
</svg>

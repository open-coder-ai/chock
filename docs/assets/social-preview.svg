  <line x1="48" y1="92" x2="1232" y2="92" stroke="#D9B45C" stroke-opacity="0.13" stroke-width="1"/>
  <text x="48" y="140" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">— GOVERNANCE AS CODE</text>
  <text x="48" y="190" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#E8EEF6">Write the rule once.</text>
  <text x="48" y="230" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#D9B45C">Every agent obeys it.</text>
  <text x="48" y="276" font-family="Geist Mono" font-size="13" fill="#9FB0C4">A policy compiles to whatever control each agent</text>
  <text x="48" y="298" font-family="Geist Mono" font-size="13" fill="#9FB0C4">actually supports — git hooks, CI gates, native</text>
  <text x="48" y="320" font-family="Geist Mono" font-size="13" fill="#9FB0C4">pre-execution hooks, AGENTS.md. Not prose to ignore.</text>
  <text x="48" y="372" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">THE EVERYDAY LOOP</text>

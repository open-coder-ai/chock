<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Chock architecture: author a policy once, compile it, enforce it on every agent's surface.">
  <style>
    :root {
      --bg: transparent;
      --ink: #1f2430; --sub: #5b6270; --line: #d5d9e0;
      --card: #ffffff; --card-stroke: #e2e5ec;
      --accent: #4f46e5; --accent-soft: #eef0fe;
      --ok: #1c925c; --ok-soft: #e5f4ec;
      --amber: #b0740f; --amber-soft: #fbf1de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8ebf2; --sub: #a2a9ba; --line: #333d51;
        --card: #171c26; --card-stroke: #2a3242;
        --accent: #8b93ff; --accent-soft: #1e2336;
        --ok: #40ce8a; --ok-soft: #16261e;
        --amber: #e0a83c; --amber-soft: #2a2413;
      }
    }
    .title { fill: var(--ink); font-weight: 700; }
    .label { fill: var(--ink); font-weight: 600; }
    .sub { fill: var(--sub); }
    .ey { fill: var(--accent); font-weight: 700; letter-spacing: .12em; }
    .card { fill: var(--card); stroke: var(--card-stroke); }
    .flow { stroke: var(--line); stroke-width: 2; fill: none; }
    .accentline { stroke: var(--accent); stroke-width: 2; fill: none; }
  </style>

  <text x="430" y="34" text-anchor="middle" class="title" font-size="21">Author once &#8594; Compile &#8594; Enforce everywhere</text>

  <!-- STAGE 1: Author -->
  <text x="120" y="76" text-anchor="middle" class="ey" font-size="11">1 &#183; AUTHOR</text>
  <rect x="30" y="88" width="180" height="132" rx="12" class="card"/>
  <text x="120" y="112" text-anchor="middle" class="label" font-size="13">Policy (one source)</text>
  <rect x="50" y="126" width="140" height="26" rx="6" fill="var(--accent-soft)"/>
  <text x="120" y="143" text-anchor="middle" class="label" font-size="12">rule</text>
  <rect x="50" y="158" width="140" height="26" rx="6" fill="var(--accent-soft)"/>
  <text x="120" y="175" text-anchor="middle" class="label" font-size="12">hook</text>
  <rect x="50" y="190" width="140" height="22" rx="6" fill="var(--accent-soft)"/>
  <text x="120" y="206" text-anchor="middle" class="label" font-size="12">skill / subagent</text>

  <!-- arrow 1 -->
  <path d="M212 154 H262" class="accentline" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Compile -->
  <text x="352" y="76" text-anchor="middle" class="ey" font-size="11">2 &#183; COMPILE</text>
  <rect x="266" y="104" width="172" height="100" rx="12" class="card" stroke="var(--accent)"/>
  <text x="352" y="140" text-anchor="middle" class="label" font-size="14">Chock</text>
  <text x="352" y="160" text-anchor="middle" class="label" font-size="14">Compiler</text>
  <text x="352" y="184" text-anchor="middle" class="sub" font-size="11">validate &#183; emit &#183; coverage</text>

  <!-- fan-out arrows to surfaces -->
  <path d="M440 130 C 486 130, 486 96, 540 96" class="flow" marker-end="url(#arrowg)"/>
  <path d="M440 144 C 486 144, 486 140, 540 140" class="flow" marker-end="url(#arrowg)"/>
  <path d="M440 158 H540" class="flow" marker-end="url(#arrowa)"/>
  <path d="M440 172 C 486 172, 486 200, 540 200" class="flow" marker-end="url(#arrowa)"/>
  <path d="M440 186 C 486 186, 486 244, 540 244" class="flow" marker-end="url(#arrowg)"/>

  <!-- STAGE 3: Surfaces -->
  <text x="700" y="76" text-anchor="middle" class="ey" font-size="11">3 &#183; ENFORCE</text>
  <g font-size="12">
    <rect x="540" y="84" width="290" height="26" rx="6" fill="var(--ok-soft)"/>
    <text x="554" y="101" class="label">git hook</text>
    <text x="820" y="101" text-anchor="end" class="sub" font-size="10">all agents</text>

    <rect x="540" y="128" width="290" height="26" rx="6" fill="var(--ok-soft)"/>
    <text x="554" y="145" class="label">CI gate</text>
    <text x="820" y="145" text-anchor="end" class="sub" font-size="10">all agents</text>

    <rect x="540" y="146" width="0" height="0"/>
    <rect x="540" y="172" width="290" height="26" rx="6" fill="var(--amber-soft)"/>
    <text x="554" y="189" class="label">AGENTS.md rule</text>
    <text x="820" y="189" text-anchor="end" class="sub" font-size="10">advisory</text>

    <rect x="540" y="188" width="0" height="0"/>
    <rect x="540" y="216" width="290" height="26" rx="6" fill="var(--accent-soft)"/>
    <text x="554" y="233" class="label">Claude PreToolUse</text>
    <text x="820" y="233" text-anchor="end" class="sub" font-size="10">Claude</text>

    <rect x="540" y="232" width="290" height="26" rx="6" fill="var(--accent-soft)"/>
    <text x="554" y="249" class="label">managed settings</text>
    <text x="820" y="249" text-anchor="end" class="sub" font-size="10">Claude</text>
  </g>

  <!-- STAGE 4: Agents strip -->
  <rect x="30" y="300" width="800" height="120" rx="12" class="card"/>
  <text x="52" y="328" class="ey" font-size="11">TARGET AGENTS &#183; ONE POLICY, EVERY SURFACE</text>
  <g font-size="12.5" class="label">
    <rect x="52" y="344" width="120" height="30" rx="6" fill="var(--accent-soft)"/><text x="112" y="364" text-anchor="middle">Claude Code</text>
    <rect x="184" y="344" width="110" height="30" rx="6" fill="var(--accent-soft)"/><text x="239" y="364" text-anchor="middle">Copilot</text>
    <rect x="306" y="344" width="110" height="30" rx="6" fill="var(--accent-soft)"/><text x="361" y="364" text-anchor="middle">Cursor</text>
    <rect x="428" y="344" width="110" height="30" rx="6" fill="var(--accent-soft)"/><text x="483" y="364" text-anchor="middle">Codex</text>
    <rect x="550" y="344" width="110" height="30" rx="6" fill="var(--accent-soft)"/><text x="605" y="364" text-anchor="middle">Gemini</text>
    <rect x="672" y="344" width="110" height="30" rx="6" fill="var(--accent-soft)"/><text x="727" y="364" text-anchor="middle">Aider</text>

    <rect x="52" y="382" width="120" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="112" y="399" text-anchor="middle" class="sub">Windsurf</text>
    <rect x="184" y="382" width="110" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="239" y="399" text-anchor="middle" class="sub">Devin</text>
    <rect x="306" y="382" width="110" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="361" y="399" text-anchor="middle" class="sub">Grok</text>
    <rect x="428" y="382" width="110" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="483" y="399" text-anchor="middle" class="sub">Kimi</text>
    <rect x="550" y="382" width="110" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="605" y="399" text-anchor="middle" class="sub">Replit</text>
    <rect x="672" y="382" width="110" height="26" rx="6" fill="var(--card)" stroke="var(--card-stroke)"/><text x="727" y="399" text-anchor="middle" class="sub">&#8230; &amp; more</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--accent)"/></marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker>
    <marker id="arrowa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker>
  </defs>
</svg>

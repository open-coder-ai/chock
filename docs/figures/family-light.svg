<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">The open-coder-ai family</title>
  <desc id="d">A layered diagram. agentseam is the foundation across the bottom; chock sits on it; chock-catalog feeds chock and generates the four plugin repositories; chock-threat-intel feeds the catalog; context-report runs as a verification arm beside all of them.</desc>
  <rect width="800" height="420" fill="#fcfcfb"/>
  <rect x="24" y="24" width="262" height="72" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="36" y="46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">chock-threat-intel</text>
  <text x="36" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">the threat ledger the catalog's</text>
  <text x="36" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">policies answer to</text>
  <rect x="314" y="24" width="262" height="72" rx="4" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="2"/>
  <text x="326" y="44" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">plugin repositories</text>
  <text x="326" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">the catalog, packaged for each</text>
  <text x="326" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">agent's plugin format (generated)</text>
  <line x1="155" y1="96" x2="155" y2="122" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="155,122 149,116 161,116" fill="#2a78d6"/>
  <line x1="445" y1="122" x2="445" y2="96" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="445,96 439,102 451,102" fill="#2a78d6"/>
  <rect x="24" y="124" width="552" height="74" rx="4" fill="#2a78d6"/>
  <text x="36" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#fcfcfb" text-anchor="start">chock-catalog</text>
  <text x="36" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="start">the policies — 39, each labelled enforced or advisory, with replayed evals</text>
  <line x1="300" y1="198" x2="300" y2="224" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="300,224 294,218 306,218" fill="#2a78d6"/>
  <rect x="24" y="226" width="552" height="74" rx="4" fill="#2a78d6"/>
  <text x="36" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#fcfcfb" text-anchor="start">chock</text>
  <text x="36" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="start">the compiler — one policy into git hooks, CI gates and native pre-tool</text>
  <text x="36" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="start">hooks</text>
  <line x1="300" y1="328" x2="300" y2="302" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="300,302 294,308 306,308" fill="#2a78d6"/>
  <rect x="24" y="330" width="552" height="74" rx="4" fill="#2a78d6"/>
  <text x="36" y="352" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#fcfcfb" text-anchor="start">agentseam</text>
  <text x="36" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="start">the primitives — one handler API and a verified capability matrix across</text>
  <text x="36" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fcfcfb" text-anchor="start">16 agents</text>
  <rect x="596" y="24" width="180" height="380" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="608" y="46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">context-report</text>
  <text x="608" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">the evidence — a</text>
  <text x="608" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">signed report of</text>
  <text x="608" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">whether an agent</text>
  <text x="608" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">artifact actually</text>
  <text x="608" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">works</text>
  <text x="608" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">measures all four</text>
  <line x1="592" y1="140" x2="580" y2="140" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="580,140 586,134 586,146" fill="#2a78d6"/>
  <line x1="592" y1="242" x2="580" y2="242" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="580,242 586,236 586,248" fill="#2a78d6"/>
  <line x1="592" y1="346" x2="580" y2="346" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="580,346 586,340 586,352" fill="#2a78d6"/>
</svg>

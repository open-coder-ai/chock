<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t d">
  <title id="t">One policy, eight surfaces</title>
  <desc id="d">A fan-out diagram: one chock policy compiles into eight enforcement surfaces. All 15 supported agent names get the advisory ambient rule and the two commit-time gates, git hook and CI gate. 9 also get a native pre-tool-use hook, enforced live in the agent, and 2 (vscode, copilot -- one underlying vendor) get chock's own agent-hooks file, also enforced in-agent. Three surfaces are named for honesty though no agent reaches them yet: managed-setting is compiled for Claude but not installed, gateway is modelled but not emitted, and mcp-gateway emits but is not yet credited to any agent.</desc>
  <rect width="760" height="500" fill="#fcfcfb"/>
  <rect x="20" y="20" width="720" height="70" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="36" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">one policy</text>
  <text x="36" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">.agents/policies/&lt;id&gt;/manifest.yaml -- compiled by chock.compile.compiler</text>

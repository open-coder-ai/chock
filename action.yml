name: Chock Governance Check
author: Open Coder AI
description: Run a Chock command in CI with a pinned pipx install.
branding:
  icon: shield
  color: gray-dark

inputs:
  command:
    description: Chock command to run
    required: false
    default: check
  version:
    description: Chock version to install
    required: false
    default: "0.1.0"

runs:
  using: composite
  steps:
    - name: Install Chock
      shell: bash
      env:
        # Inputs come from the ADOPTER's workflow, which may interpolate untrusted text
        # (a PR title, an issue body). Expanded by the runner into shell source they
        # become code in the adopter's repo -- through the environment they stay data.
        CHOCK_VERSION: ${{ inputs.version }}
      run: pipx install "chock==$CHOCK_VERSION"
    - name: Run Chock
      shell: bash
      env:
        CHOCK_COMMAND: ${{ inputs.command }}
      run: |
        # Unquoted on purpose: the input is an argv string ("check --only validate") and
        # must word-split. Word-splitting an expansion cannot execute metacharacters --
        # a ; or && inside a variable is an argument, not a separator -- and set -f
        # disables the one remaining hazard, glob expansion.
        set -f
        chock $CHOCK_COMMAND
